<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | escape }} · 此岸 彼岸</title>
    <meta
      name="description"
      content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: #ffffff;
        --foreground: #090909;
        --muted: #79716b;
        --border: #e8e6e3;
        --surface: #f7f7f6;
        --code: #f3f2f0;
        --code-surface: #fbfaf8;
        --code-border: #dedbd4;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--background);
        color: var(--foreground);
        font-family: "Newsreader", ui-serif, Georgia, serif;
        font-size: 18px;
        line-height: 31px;
        margin: 0;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration-color: rgba(9, 9, 9, 0.32);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      a:hover {
        text-decoration-color: currentColor;
      }

      h1,
      h2,
      h3,
      p,
      pre,
      ul,
      ol {
        margin-top: 0;
      }

      .page {
        margin: 0 auto;
        max-width: 720px;
        padding: 48px 24px 96px;
      }

      header {
        align-items: flex-start;
        display: flex;
        justify-content: space-between;
        margin-bottom: 62px;
      }

      .wordmark,
      nav,
      .date,
      footer {
        font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
      }

      .wordmark {
        color: var(--muted);
        font-size: 15px;
        font-weight: 500;
        line-height: 20px;
        text-decoration: none;
      }

      nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: right;
      }

      nav a,
      footer a {
        color: var(--muted);
        font-size: 14px;
        line-height: 20px;
        text-decoration: none;
        text-transform: lowercase;
      }

      nav a:hover,
      footer a:hover {
        color: var(--foreground);
      }

      article {
        margin: 0 auto;
      }

      .date {
        color: var(--muted);
        font-size: 14px;
        line-height: 20px;
        margin-bottom: 14px;
      }

      h1 {
        font-size: clamp(2.25rem, 8.5vw, 3.25rem);
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1.12;
        margin-bottom: 30px;
      }

      h2 {
        font-size: 1.7rem;
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1.18;
        margin: 48px 0 14px;
      }

      h3 {
        font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 22px;
        margin: 32px 0 10px;
      }

      p {
        margin-bottom: 24px;
      }

      ul,
      ol {
        margin-bottom: 26px;
        padding-left: 24px;
      }

      li {
        margin-bottom: 7px;
      }

      hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 42px 0;
      }

      code {
        background: var(--code);
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 0.85em;
        padding: 0.1em 0.28em;
      }

      div.highlighter-rouge,
      div.highlight {
        margin: 0 0 28px;
      }

      pre {
        background: var(--code-surface);
        border: 1px solid var(--code-border);
        border-radius: 8px;
        color: #24211d;
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 1.65;
        margin: 0 0 28px;
        overflow-x: auto;
        padding: 16px 18px;
        tab-size: 4;
      }

      pre code {
        background: transparent;
        border-radius: 0;
        display: block;
        font-size: inherit;
        line-height: inherit;
        padding: 0;
        white-space: pre;
      }

      div.highlighter-rouge pre,
      div.highlight pre {
        margin-bottom: 0;
      }

      .highlight .c,
      .highlight .c1,
      .highlight .cm {
        color: #81786d;
      }

      .highlight .k,
      .highlight .kd,
      .highlight .kn {
        color: #7f4f9f;
      }

      .highlight .nb,
      .highlight .nf,
      .highlight .nc {
        color: #1f5d8c;
      }

      .highlight .s,
      .highlight .s1,
      .highlight .s2 {
        color: #8a4f18;
      }

      .highlight .mi,
      .highlight .mf {
        color: #356b3f;
      }

      figure {
        margin: 34px 0;
      }

      figure img {
        display: block;
        height: auto;
        max-width: 100%;
      }

      figcaption {
        color: var(--muted);
        font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        line-height: 20px;
        margin-top: 10px;
      }

      .visual-diagram {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      .visual-diagram img {
        background: #fffdf7;
      }

      footer {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 14px;
        gap: 10px;
        justify-content: space-between;
        line-height: 20px;
        margin-top: 54px;
      }

      .links {
        display: flex;
        gap: 12px;
      }

      @media (max-width: 680px) {
        .page {
          padding-top: 36px;
        }

        header {
          margin-bottom: 48px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="wordmark" href="/">此岸 彼岸</a>
        <nav aria-label="Primary navigation">
          <a href="/">home</a>
          <a href="/#essays">essays</a>
        </nav>
      </header>

      <main>
        <article>
          <div class="date">{{ page.date | date: "%b %-d, %Y" }}</div>
          <h1>{{ page.title | escape }}</h1>
          {{ content }}
        </article>
      </main>

      <footer>
        <span>chuan · 2026</span>
        <div class="links">
          <a href="mailto:masterkeywikz@gmail.com">email</a>
          <a href="https://github.com/masterkeywikz">github</a>
        </div>
      </footer>
    </div>
  </body>
</html>
