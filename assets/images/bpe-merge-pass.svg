<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">One byte pair encoding merge pass</title>
  <desc id="desc">A hand drawn style diagram showing raw byte tokens, adjacent pair counts, the selected pair, and the merged token sequence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f1f1f"/>
    </marker>
    <style>
      .paper { fill: #fffdf7; }
      .ink { stroke: #1f1f1f; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .soft { stroke: #7a746c; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .box { fill: #ffffff; stroke: #1f1f1f; stroke-width: 2.2; }
      .box2 { fill: #f8f1dc; stroke: #1f1f1f; stroke-width: 2.2; }
      .chosen { fill: #dff1ff; stroke: #1f1f1f; stroke-width: 2.4; }
      .merge { fill: #e8f6e8; stroke: #1f1f1f; stroke-width: 2.4; }
      .label { fill: #1f1f1f; font: 600 24px Figtree, Arial, sans-serif; }
      .small { fill: #1f1f1f; font: 500 18px Figtree, Arial, sans-serif; }
      .tiny { fill: #7a746c; font: 500 15px Figtree, Arial, sans-serif; }
      .mono { fill: #1f1f1f; font: 600 21px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect class="paper" width="980" height="620"/>

  <text class="label" x="54" y="56">One BPE training merge, using "banana"</text>
  <text class="tiny" x="54" y="84">ASCII letters stand in for byte ids, so the mechanics stay visible.</text>

  <text class="small" x="54" y="145">1. Start with byte tokens</text>
  <g transform="translate(54 170)">
    <rect class="box" x="0" y="0" width="58" height="54" rx="10"/>
    <rect class="box" x="66" y="2" width="58" height="52" rx="9"/>
    <rect class="box" x="132" y="-1" width="58" height="55" rx="10"/>
    <rect class="box" x="198" y="1" width="58" height="53" rx="9"/>
    <rect class="box" x="264" y="0" width="58" height="54" rx="10"/>
    <rect class="box" x="330" y="2" width="58" height="52" rx="9"/>
    <text class="mono" x="21" y="35">b</text>
    <text class="mono" x="87" y="35">a</text>
    <text class="mono" x="153" y="35">n</text>
    <text class="mono" x="219" y="35">a</text>
    <text class="mono" x="285" y="35">n</text>
    <text class="mono" x="351" y="35">a</text>
  </g>

  <path class="ink" marker-end="url(#arrow)" d="M 470 197 C 520 178, 560 178, 604 198"/>

  <text class="small" x="620" y="145">2. Count adjacent pairs</text>
  <g transform="translate(620 166)">
    <rect class="box2" x="0" y="0" width="256" height="146" rx="14"/>
    <text class="mono" x="26" y="42">(b,a) -> 1</text>
    <text class="mono" x="26" y="78">(a,n) -> 2</text>
    <text class="mono" x="26" y="114">(n,a) -> 2</text>
    <path class="soft" d="M 16 56 C 82 50, 150 52, 230 56"/>
  </g>

  <text class="small" x="54" y="360">3. Pick the best pair by merge priority</text>
  <g transform="translate(54 384)">
    <rect class="chosen" x="0" y="0" width="330" height="78" rx="14"/>
    <text class="mono" x="24" y="49">merge (a,n) -> AN</text>
  </g>
  <text class="tiny" x="54" y="486">If two pairs have the same count, the learned merge ranking decides which one applies first.</text>

  <path class="ink" marker-end="url(#arrow)" d="M 432 423 C 486 406, 542 408, 600 426"/>

  <text class="small" x="620" y="360">4. Replace every matching occurrence</text>
  <g transform="translate(620 384)">
    <rect class="box" x="0" y="0" width="58" height="54" rx="10"/>
    <rect class="merge" x="66" y="-2" width="76" height="58" rx="12"/>
    <rect class="merge" x="150" y="-1" width="76" height="56" rx="12"/>
    <rect class="box" x="234" y="2" width="58" height="52" rx="9"/>
    <text class="mono" x="21" y="35">b</text>
    <text class="mono" x="88" y="36">AN</text>
    <text class="mono" x="172" y="36">AN</text>
    <text class="mono" x="255" y="35">a</text>
  </g>

  <path class="soft" d="M 112 231 C 142 254, 173 254, 203 231"/>
  <path class="soft" d="M 244 231 C 274 254, 305 254, 335 231"/>
  <text class="tiny" x="132" y="278">(a,n)</text>
  <text class="tiny" x="264" y="278">(a,n)</text>
</svg>
